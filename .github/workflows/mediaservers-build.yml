name: Build unsigned IPAs (Emby & Plex fork)

# Builds the app on a GitHub-hosted Mac, so no Mac of your own is needed.
# The upstream workflows use a private `xcode-27` runner a fork can't reach.
# Output: unsigned .ipa files under the run's Artifacts. Sign and install them
# with Sideloadly, AltStore, or SideStore using your own Apple ID.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        default: ios
        options: [ios, tvos, both]
      runner:
        description: GitHub Mac image (try another if the run waits for a machine)
        type: choice
        default: macos-26
        options: [macos-26, macos-latest, macos-15, macos-15-intel]

jobs:
  # Only the chosen platform asks GitHub for a Mac.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          WANTED: ${{ inputs.platform }}
        run: |
          ios='{"platform":"ios","scheme":"Silo","sdk":"iphoneos","destination":"generic/platform=iOS"}'
          tvos='{"platform":"tvos","scheme":"SiloTV","sdk":"appletvos","destination":"generic/platform=tvOS"}'
          case "$WANTED" in
            ios) inc="[$ios]" ;;
            tvos) inc="[$tvos]" ;;
            *) inc="[$ios,$tvos]" ;;
          esac
          echo "matrix={\"include\":$inc}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use the newest installed Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: iosApp
        run: xcodegen generate

      - name: Archive (unsigned)
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Silo.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -sdk "${{ matrix.sdk }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > "$RUNNER_TEMP/build.log" 2>&1 || true
          grep -nE "error:|fatal|Stack dump|nonzero exit|BUILD|ARCHIVE|requires Xcode|Swift Compiler" "$RUNNER_TEMP/build.log" | head -150 || true
          if [ ! -d "$RUNNER_TEMP/app.xcarchive/Products/Applications" ]; then
            echo "===== last 150 lines of build log ====="
            tail -150 "$RUNNER_TEMP/build.log"
            exit 1
          fi

      - name: Package IPA
        run: |
          cd "$RUNNER_TEMP"
          rm -rf Payload && mkdir Payload
          cp -R app.xcarchive/Products/Applications/*.app Payload/
          zip -qry "${{ matrix.scheme }}-unsigned.ipa" Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scheme }}-unsigned-ipa
          path: ${{ runner.temp }}/${{ matrix.scheme }}-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.scheme }}-build-log
          path: ${{ runner.temp }}/build.log
